dataset:
  root_path: data/public/input

agent:
  strategy: codeact
  model: YOUR_MODEL_NAME
  api_base: YOUR_OPENAI_COMPATIBLE_API_BASE
  api_key: YOUR_API_KEY
  max_steps: 10
  temperature: 0.0
  model_timeout_seconds: 90
  max_output_tokens: 2048
  python_timeout_seconds: 45
  prompt_history_steps: 4
  full_observation_threshold: 6000
  observation_head_chars: 1800
  observation_tail_chars: 1800
  stderr_tail_chars: 4000
  final_marker_chars: 4000
  verifier_enabled: true
  verifier_stdout_chars: 2500

run:
  output_dir: artifacts/runs
  run_id: codeact_example_run
  max_workers: 4
  task_timeout_seconds: 300
